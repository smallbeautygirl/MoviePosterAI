<h2>你對哪些技術比較熟悉？</h2>
<p class="subtitle">3 個月的時間，選熟悉的技術棧可以大幅降低風險（可多選）</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="diffusion" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Diffusion Model（擴散模型）</h3>
      <p>Stable Diffusion、SDXL、ComfyUI 等，有用過或了解原理</p>
    </div>
  </div>
  <div class="option" data-choice="clip" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>CLIP / 視覺語言模型</h3>
      <p>CLIP、BLIP、OpenCLIP，有用過做圖文比對或特徵提取</p>
    </div>
  </div>
  <div class="option" data-choice="pytorch" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>PyTorch / 深度學習訓練</h3>
      <p>可以自己寫訓練迴圈、做 fine-tuning、調超參數</p>
    </div>
  </div>
  <div class="option" data-choice="cv-classic" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>傳統 CV（分類、偵測、特徵提取）</h3>
      <p>CNN、ResNet、YOLO 等，比較熟傳統圖像分析</p>
    </div>
  </div>
  <div class="option" data-choice="none" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>以上都不太熟，但學習能力強</h3>
      <p>願意在 3 個月內邊學邊做</p>
    </div>
  </div>
</div>
