<h2>這篇論文是什麼學術等級？</h2>
<p class="subtitle">不同等級對題目範圍、深度、貢獻度要求不同</p>

<div class="options">
  <div class="option" data-choice="undergrad" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>大學專題 / 畢業論文（Undergraduate）</h3>
      <p>範圍較小，重在實作與驗證，允許使用既有模型微調或組合</p>
    </div>
  </div>
  <div class="option" data-choice="master" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>碩士論文（Master's Thesis）</h3>
      <p>需要一定原創性貢獻，可以提出改良方法或新評估框架</p>
    </div>
  </div>
  <div class="option" data-choice="phd" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>博士論文 / 期刊論文（PhD / Journal Paper）</h3>
      <p>需要顯著學術貢獻，提出新架構、新方法、新資料集等</p>
    </div>
  </div>
  <div class="option" data-choice="conference" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>研討會論文（Conference Paper）</h3>
      <p>聚焦單一貢獻點，例如新評估指標或特定生成改良</p>
    </div>
  </div>
</div>
